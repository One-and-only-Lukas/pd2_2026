<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>


      <a-cylinder position="-1 2 -3" rotation="0 0 90" color="#4CC3D9" width="10" height="10" depth="5"></a-cylinder>
      <a-sphere position="-6 2 -3'rotation="0 0 0" color="#4CC3D9" radius="1"></a-sphere>



      <a-box position="-1 2 -1" rotation="90 120 90" color="#4CC3D9" width="3" height="4" depth="0.5"></a-box> 
      <a-box position="1.5 2 0.75" rotation="90 0 90" color="#4CC3D9" width="1.5" height="6" depth="0.5"></a-box> 


      <a-box position="-1 2 -5" rotation="90 -120 90" color="#4CC3D9" width="3" height="4" depth="0.5"></a-box> 
      <a-box position="1.5 2 -6.75" rotation="90 0 90" color="#4CC3D9" width="1.5" height="6" depth="0.5"></a-box> 


      <a-cone position="1.5 5 -6.75" rotation="90 0 90" color="#4CC3D9" width="1.5" height="6" depth="0.5"></a-cone> 




      <a-plane position="0 0 -4" rotation="-90 0 0" width="16" height="16" color="#7BC8A4"></a-plane>

      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
